name: Build desktop app (Tauri)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build, sign & notarize macOS app (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-app-aarch64-apple-darwin

      # 跟 build-binaries-for-release.yml 的 macOS 依賴設定保持一致
      - name: Install system dependencies
        run: |
          brew install pkg-config opus cmake
          HOMEBREW_PREFIX=$(brew --prefix)
          echo "PKG_CONFIG_PATH=$HOMEBREW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "OPUS_LIB_DIR=$HOMEBREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "OPUS_INCLUDE_DIR=$HOMEBREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "OPUS_STATIC=1" >> "$GITHUB_ENV"
          echo "CFLAGS=-I$HOMEBREW_PREFIX/include -arch arm64" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$HOMEBREW_PREFIX/lib -arch arm64" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-L$HOMEBREW_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/ui
        run: npm ci

      - name: Build aoede bot binary (release)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Stage aoede as the Tauri sidecar
        run: |
          mkdir -p src/ui/src-tauri/binaries
          cp target/aarch64-apple-darwin/release/aoede \
             src/ui/src-tauri/binaries/aoede-aarch64-apple-darwin

      # 標準做法：把 .p12 憑證匯入一個暫時的 keychain，簽署時才找得到。
      # APPLE_CERTIFICATE 是 .p12 檔案 base64 編碼後的內容，
      # APPLE_CERTIFICATE_PASSWORD 是匯出 .p12 時設定的密碼。
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build, sign & notarize the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src/ui
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'Aoede Desktop ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

  build-windows:
    name: Build Windows desktop app (unsigned)
    # 鎖定 windows-2022（而非會浮動的 windows-latest）：目前的 windows-latest
    # image 帶了太新的 Visual Studio 工具鏈，aws-lc-sys 的 build script 認不出
    # 它的 CMake generator，會導致 C11 atomics 編譯測試失敗。
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-app-x86_64-pc-windows-msvc

      # 跟 build-binaries-for-release.yml 的 Windows 依賴設定保持一致，
      # aoede 靠 rust-dns-sd 需要這個 SDK 才能編。
      - name: Install Bonjour SDK dependencies
        shell: powershell
        run: |
          $BonjourPath = ".\rust-dns-sd\BonjourSDK"

          if (Test-Path $BonjourPath) {
            $LibPath = Join-Path $BonjourPath "Lib\x64"
            $IncludePath = Join-Path $BonjourPath "Include"

            $AbsLibPath = (Resolve-Path $LibPath).Path
            $AbsIncludePath = (Resolve-Path $IncludePath).Path

            echo "BONJOUR_SDK_HOME=$BonjourPath" >> $env:GITHUB_ENV
            echo "LIB=$AbsLibPath;$env:LIB" >> $env:GITHUB_ENV
            echo "INCLUDE=$AbsIncludePath;$env:INCLUDE" >> $env:GITHUB_ENV
          } else {
            Write-Error "Bonjour SDK path not found: $BonjourPath"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/ui
        run: npm ci

      - name: Build aoede bot binary (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage aoede as the Tauri sidecar
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path src/ui/src-tauri/binaries | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/aoede.exe `
            src/ui/src-tauri/binaries/aoede-x86_64-pc-windows-msvc.exe

      # 還沒有 Windows code signing 憑證，先出 unsigned 版本：
      # 使用者第一次執行會看到 SmartScreen「未知發布者」警告，但可以正常執行。
      # 之後買了憑證，比照 macOS job 加一個匯入 .pfx 的步驟、
      # 在下面這個 action 加上 WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD 就好。
      - name: Build the desktop app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/ui
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: 'Aoede Desktop ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

  build-linux:
    name: Build Linux desktop app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-app-x86_64-unknown-linux-gnu

      # libavahi/libasound 是 aoede 自己需要的（跟 build-binaries-for-release.yml
      # 一致）；webkit2gtk/gtk/appindicator/librsvg/patchelf 是 Tauri 打包 Linux app
      # 的官方必要套件。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libavahi-compat-libdnssd-dev \
            libasound2-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/ui
        run: npm ci

      - name: Build aoede bot binary (release)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage aoede as the Tauri sidecar
        run: |
          mkdir -p src/ui/src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/aoede \
             src/ui/src-tauri/binaries/aoede-x86_64-unknown-linux-gnu

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/ui
          args: --target x86_64-unknown-linux-gnu
          tagName: ${{ github.ref_name }}
          releaseName: 'Aoede Desktop ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
